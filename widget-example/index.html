<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Island widget</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@nethesis/chat-island@latest/dist-widget/index.widget.css" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 48rem; }
      .demo textarea { width: 100%; height: 5rem; font-family: monospace; }
      .demo button { margin: 0.25rem 0.25rem 0.25rem 0; }
      #log { font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; background: #f3f4f6; padding: 0.75rem; max-height: 16rem; overflow: auto; }
    </style>
  </head>
  <body class="demo">
    <h1>Chat Island widget</h1>
    <p>Paste a Base64 token of <code>&lt;cti_host&gt;:&lt;cti_username&gt;:&lt;cti_token&gt;</code>, then connect.</p>
    <textarea id="token" placeholder="Base64 config token"></textarea>
    <div>
      <button id="connect">Connect</button>
      <button id="new">New chat</button>
      <input id="peer" placeholder="username" /><button id="open">Open chat</button>
      <button id="theme">Toggle theme</button>
    </div>
    <h2>Events</h2>
    <div id="log"></div>
    <script src="./index.js"></script>
  </body>
</html>
